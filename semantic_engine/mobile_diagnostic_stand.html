<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeEEG8 Engineering Stand</title>
    <style>
        body { background: #050505; color: #0f0; font-family: 'Courier New', monospace; margin: 10px; user-select: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .card { background: #111; border: 1px solid #333; padding: 10px; border-radius: 8px; text-align: center; }
        .label { font-size: 10px; color: #888; text-transform: uppercase; }
        .value { font-size: 20px; color: #fff; display: block; margin-top: 5px; }
        
        button { background: #000; color: #0f0; border: 2px solid #0f0; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; font-family: monospace; cursor: pointer; box-shadow: 0 0 10px rgba(0,255,0,0.2); }
        button:active { background: #0f0; color: #000; }
        button.stop { border-color: #f00; color: #f00; }

        select { background: #000; color: #0ff; border: 1px solid #0ff; padding: 5px; width: 100%; margin-top: 5px; }

        canvas { background: #000; width: 100%; height: 120px; border: 1px solid #222; border-radius: 8px; display: block; margin-top: 5px; }
        .status { font-size: 12px; margin: 10px 0; color: #0ff; }
        .ok { color: #0f0; } .warn { color: #ff0; } .err { color: #f00; }
    </style>
</head>
<body>

    <button id="btnConnect">1. CONNECT FREE-EEG8</button>
    
    <div class="status" id="lblStatus">STATUS: DISCONNECTED</div>

    <div class="grid">
        <div class="card">
            <div class="label">PGA GAIN</div>
            <select id="gainSelect">
                <option value="0">GAIN 1 (0x0)</option>
                <option value="1">GAIN 2 (0x1)</option>
                <option value="2" selected>GAIN 4 (0x2)</option>
                <option value="3">GAIN 8 (0x3)</option>
                <option value="4">GAIN 16 (0x4)</option>
                <option value="5">GAIN 32 (0x5)</option>
            </select>
        </div>
        <div class="card">
            <div class="label">NOTCH FILTERS</div>
            <div style="margin-top:10px;">
                <input type="checkbox" id="chkNotch" checked> 50/100 Hz
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="card"><div class="label">AMP (uV)</div><span id="valAmp" class="value">--</span></div>
        <div class="card"><div class="label">RHY (%)</div><span id="valRhy" class="value">--</span></div>
        <div class="card"><div class="label">SNR (%)</div><span id="valSnr" class="value">--</span></div>
        <div class="card"><div class="label">DC DRIFT</div><span id="valDc" class="value">--</span></div>
    </div>

    <div class="label">RAW PZ (0.5 SEC WINDOW)</div>
    <canvas id="scopeRaw"></canvas>

    <div class="label">THETA BAND (4-8 HZ)</div>
    <canvas id="scopeTheta"></canvas>

<script>
/**
 * БИБЛИОТЕКА ФИЛЬТРОВ (Bi-quad IIR)
 */
class Biquad {
    constructor(type, f0, fs, Q = 1) {
        this.x1=0; this.x2=0; this.y1=0; this.y2=0;
        const w0 = 2 * Math.PI * f0 / fs;
        const alpha = Math.sin(w0) / (2 * Q);
        const cosW = Math.cos(w0);
        if (type === 'notch') {
            this.b0 = 1; this.b1 = -2 * cosW; this.b2 = 1;
            this.a0 = 1 + alpha; this.a1 = -2 * cosW; this.a2 = 1 - alpha;
        } else if (type === 'bp') {
            this.b0 = alpha; this.b1 = 0; this.b2 = -alpha;
            this.a0 = 1 + alpha; this.a1 = -2 * cosW; this.a2 = 1 - alpha;
        }
    }
    process(x) {
        let y = (this.b0 / this.a0) * x + (this.b1 / this.a0) * this.x1 + (this.b2 / this.a0) * this.x2
                - (this.a1 / this.a0) * this.y1 - (this.a2 / this.a0) * this.y2;
        this.x2 = this.x1; this.x1 = x; this.y2 = this.y1; this.y1 = y;
        return y;
    }
}

// Глобальные объекты
const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const DATA_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
const CMD_UUID     = "c0de0001-36e1-4688-b7f5-ea07361b26a8";

let device, dataChar, cmdChar;
let isStreaming = false;
let currentPGA = 4;

const FS = 250;
const BUF_LEN = 500;
let rawBuffer = new Float32Array(BUF_LEN);
let thetaBuffer = new Float32Array(BUF_LEN);

// Фильтры (создаем каскад)
let notch50 = new Biquad('notch', 50, FS, 30);
let notch100 = new Biquad('notch', 100, FS, 30);
let thetaBP = new Biquad('bp', 6, FS, 1.2);

async function sendGain() {
    if (!cmdChar) return;
    const g = parseInt(document.getElementById('gainSelect').value);
    const val = (g << 12) | (g << 8) | (g << 4) | g;
    const cmd = new Uint8Array([0x04, (val >> 8) & 0xFF, val & 0xFF]);
    const cmd2 = new Uint8Array([0x05, (val >> 8) & 0xFF, val & 0xFF]);
    await cmdChar.writeValue(cmd);
    await new Promise(r => setTimeout(r, 50));
    await cmdChar.writeValue(cmd2);
    currentPGA = Math.pow(2, g);
    console.log("Gain updated to:", currentPGA);
}

document.getElementById('btnConnect').onclick = async () => {
    try {
        device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        dataChar = await service.getCharacteristic(DATA_UUID);
        cmdChar = await service.getCharacteristic(CMD_UUID);

        await sendGain();

        await dataChar.startNotifications();
        dataChar.addEventListener('characteristicvaluechanged', handleEEG);
        
        isStreaming = true;
        document.getElementById('lblStatus').innerText = "STATUS: CONNECTED (RECEIVING)";
        document.getElementById('btnConnect').innerText = "DISCONNECT";
        document.getElementById('btnConnect').classList.add('stop');
    } catch (e) {
        alert(e);
    }
};

function handleEEG(event) {
    const data = new Uint8Array(event.target.value.buffer);
    if (data[0] !== 0xA0) return;

    const UV_SCALE = (1.2 / currentPGA / 8388607.0) * 1e6;
    
    // Парсим 1 канал (Pz)
    let val = (data[2] << 16) | (data[3] << 8) | data[4];
    if (val & 0x800000) val -= 0x1000000;
    let uV = val * UV_SCALE;

    // 1. Сдвиг и Notch (фильтруем сырой)
    let clean = uV;
    if (document.getElementById('chkNotch').checked) {
        clean = notch50.process(uV);
        clean = notch100.process(clean);
    }

    rawBuffer.set(rawBuffer.subarray(1));
    rawBuffer[BUF_LEN - 1] = clean;

    // 2. Тета фильтрация
    let t = thetaBP.process(clean);
    thetaBuffer.set(thetaBuffer.subarray(1));
    thetaBuffer[BUF_LEN - 1] = t;
}

// Цикл анализа и отрисовки
function updateStand() {
    if (isStreaming) {
        // --- 1. АМПЛИТУДА (RMS) ---
        const window = thetaBuffer.slice(-125); // Последние 0.5 сек
        let rms = Math.sqrt(window.reduce((a, b) => a + b*b, 0) / 125) * 2.82; // pp approx
        document.getElementById('valAmp').innerText = rms.toFixed(1);
        document.getElementById('valAmp').className = 'value ' + (rms > 3 ? 'ok' : 'warn');

        // --- 2. РИТМИЧНОСТЬ ---
        // Ищем переходы через ноль
        let crossings = [];
        for(let i=1; i<window.length; i++) {
            if(window[i-1] < 0 && window[i] >= 0) crossings.push(i);
        }
        let rhy = 0;
        if(crossings.length >= 3) {
            let diffs = [];
            for(let i=1; i<crossings.length; i++) diffs.push(crossings[i]-crossings[i-1]);
            let mean = diffs.reduce((a,b)=>a+b)/diffs.length;
            let std = Math.sqrt(diffs.reduce((a,b)=>a+(b-mean)**2, 0)/diffs.length);
            rhy = Math.max(0, 100 - (std/mean)*200);
        }
        document.getElementById('valRhy').innerText = rhy.toFixed(0) + "%";
        document.getElementById('valRhy').className = 'value ' + (rhy > 40 ? 'ok' : 'warn');

        // --- 3. SNR (Спектральный контраст) ---
        let totalVar = rawBuffer.slice(-125).reduce((a,b)=>a+Math.abs(b),0);
        let thetaVar = window.reduce((a,b)=>a+Math.abs(b),0);
        let snr = (thetaVar / (totalVar + 1)) * 100;
        document.getElementById('valSnr').innerText = snr.toFixed(0) + "%";

        // --- 4. DC DRIFT ---
        let dc = Math.abs(rawBuffer[BUF_LEN-1] - rawBuffer[BUF_LEN-125]);
        document.getElementById('valDc').innerText = dc.toFixed(0);

        drawScope('scopeRaw', rawBuffer, 100);
        drawScope('scopeTheta', thetaBuffer, 30);
    }
    requestAnimationFrame(updateStand);
}

function drawScope(id, data, scale) {
    const canvas = document.getElementById(id);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0, canvas.width, canvas.height);
    ctx.strokeStyle = id.includes('Theta') ? '#f0f' : '#0f0';
    ctx.beginPath();
    const step = canvas.width / data.length;
    for(let i=0; i<data.length; i++) {
        let x = i * step;
        let y = (canvas.height/2) - (data[i] * (canvas.height / scale));
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
}

document.getElementById('gainSelect').onchange = sendGain;
updateStand();

</script>
</body>
</html>
